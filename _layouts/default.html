<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
<head>{% include head.html %}</head>
<body id="top">
<canvas id="ink" aria-hidden="true"></canvas>
<div class="phone">
  {% include bar.html %}
  <main class="screen" data-context>
    {% if page.kicker %}<div class="lbl">{{ page.kicker }}</div>{% endif %}
    {{ content }}
  </main>
  <footer class="foot">{{ site.teotech.footer | default: site.description }}</footer>
  {% include dock.html %}
</div>
{% unless page.tutor == false or site.teotech.tutor == false %}{% include tutor.html %}{% endunless %}
<script src="{{ '/assets/js/ink.js' | relative_url }}" defer></script>
</body>
</html>
